syntax = "proto3";

package candidate;

option go_package = "github.com/LimeOnTop/interverse-candidate/gen";

// Common response wrapper
message Response {
  bool success = 1;
  string message = 2;
  string error = 3;
}

// Pagination
message Pagination {
  int32 page = 1;
  int32 limit = 2;
  int32 total = 3;
}

// Candidate service definition
service CandidateService {
  rpc CreateCandidate(CreateCandidateRequest) returns (CreateCandidateResponse);
  rpc GetCandidate(GetCandidateRequest) returns (GetCandidateResponse);
  rpc GetCandidates(GetCandidatesRequest) returns (GetCandidatesResponse);
  rpc UpdateCandidate(UpdateCandidateRequest) returns (UpdateCandidateResponse);
  rpc DeleteCandidate(DeleteCandidateRequest) returns (Response);
  rpc SearchCandidates(SearchCandidatesRequest) returns (SearchCandidatesResponse);
}

// Candidate entity
message Candidate {
  string id = 1;
  string name = 2;
  string email = 3;
  string phone = 4;
  string position = 5;
  string experience = 6;
  string skills = 7;
  string resume_url = 8;
  string linkedin_url = 9;
  string github_url = 10;
  string status = 11;
  string created_at = 12;
  string updated_at = 13;
  string interviewer_id = 14;
}

// Create Candidate
message CreateCandidateRequest {
  string name = 1;
  string email = 2;
  string phone = 3;
  string position = 4;
  string experience = 5;
  string skills = 6;
  string resume_url = 7;
  string linkedin_url = 8;
  string github_url = 9;
  string interviewer_id = 10;
}

message CreateCandidateResponse {
  Response response = 1;
  Candidate candidate = 2;
}

// Get Candidate
message GetCandidateRequest {
  string candidate_id = 1;
}

message GetCandidateResponse {
  Response response = 1;
  Candidate candidate = 2;
}

// Get Candidates
message GetCandidatesRequest {
  string interviewer_id = 1;
  Pagination pagination = 2;
}

message GetCandidatesResponse {
  Response response = 1;
  repeated Candidate candidates = 2;
  Pagination pagination = 3;
}

// Update Candidate
message UpdateCandidateRequest {
  string candidate_id = 1;
  string name = 2;
  string email = 3;
  string phone = 4;
  string position = 5;
  string experience = 6;
  string skills = 7;
  string resume_url = 8;
  string linkedin_url = 9;
  string github_url = 10;
  string status = 11;
}

message UpdateCandidateResponse {
  Response response = 1;
  Candidate candidate = 2;
}

// Delete Candidate
message DeleteCandidateRequest {
  string candidate_id = 1;
}

// Search Candidates
message SearchCandidatesRequest {
  string query = 1;
  string interviewer_id = 2;
  Pagination pagination = 3;
}

message SearchCandidatesResponse {
  Response response = 1;
  repeated Candidate candidates = 2;
  Pagination pagination = 3;
}
